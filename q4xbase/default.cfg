echo "EXECUTING DEFAULT.CFG"

//
// KEY BINDINGS
//

unbindall

set r_varmegs 32

bind	r				_impulse13		// Reload
bind    [				_impulse14		// Previous weapon
bind	MWHEELDOWN		_impulse14
bind    ]				_impulse15		// Next weapon
bind	MWHEELUP		_impulse15
bind	f				_impulse50
bind	e				_impulse40		// Get in vehicle

bind	1			_impulse0
bind	2			_impulse1
bind	3			_impulse2
bind	4			_impulse3
bind	5			_impulse4
bind	6			_impulse5
bind	7			_impulse6
bind	8			_impulse7
bind	9			_impulse8
bind	0			_impulse11
bind	-			_impulse12
bind	g			_impulse27	// grappling hook

//
// CHARACTER CONTROLS
//

bind    LEFTCTRL		_attack
bind 	RIGHTCTRL		_attack
bind    MOUSE1			_attack

bind    MOUSE2			_altattack

bind    LEFTALT			_strafe
bind 	RIGHTALT		_strafe
bind    LEFTSHIFT		_speed
bind 	RIGHTSHIFT		_speed

bind    DEL				_lookdown
bind    PGDN			_lookup
bind    END				centerview
bind    MOUSE3			_zoom

bind	c				_movedown
bind	KP_INS			_moveup
bind    SPACE			_moveup 

bind    UPARROW			_forward
bind    w				_forward
bind    DOWNARROW		_back
bind    s				_back
bind    LEFTARROW		_left
bind    RIGHTARROW		_right
bind    a				_moveleft
bind    d				_moveright

//
// CLIENT ENVIRONMENT COMMANDS
//

bind    PAUSE			"pause"
bind    ESCAPE			"togglemenu"
bind    ~				"toggleconsole"
bind    `				"toggleconsole"
bind 	TAB				"_impulse19"

//
//	MULTIPLAYER KEYS
//
bind	t				"clientmessagemode"
bind	b				"sq_buyMenu"

//
//	DEVELOPER KEYS
//
bind	F1				help
bind	F2				fxeditor
bind	F3				"toggle com_speeds"
bind	F4				"toggle r_showPortals"
bind	F5				"toggle r_showTris"
bind 	F6				"toggle r_showLightCount"
bind	F7				"toggle r_showShadowCount"
bind	F8				"toggle r_showOverdraw"
bind	F9				noclip
bind 	F10				god
bind 	F11				screenshot
bind 	F12				EditCVars

//
// userInfo variables
// These are transfered to multiplayer servers on connecting
// and are available in the main menu gui for modification

setu	ui_name			Player
setu	ui_model		marine
setu	ui_skin			base

//
// serverInfo variables
// These are transfered from multiplayer servers on connecting
// and are available in the main menu gui for modification

sets	si_numPlayers	4
sets	si_fragLimit	10
sets	si_timeLimit	0
sets	si_map			bdube/m_dm
sets	si_gameType		deathmatch
sets	si_pure			0
sets	g_balanceTDM	0
seta	g_showHudPopups	0

// takeViewNotes values
sett	viewnotes_names 	"Gretchen Carlson;Ken Banks;Eric Biessman;Chad Bordwell;Bryan Dube;Ford Dye;Mike Egnew;Mike Ekberg;Chris Foster;Mike Gummelt;Jim Hughes;Kevin Long;Nick Maggiore;Mike Majernik;Nathan McKenzie;Scott McNutt;Corey Peters;Zack Quarles;Mike Renner;Jim Shepard;Matt Vainio;Andrew Weldon;Pat Williams;--Graham Fuchs;--Tim Willits"
sett	viewnotes_categories	"Animation;Art;Bug;Build Notes;Design;Feedback Group 1;Feedback Group 2;Feedback Group 3;Generic;Info;Jump Point;Monster;Scripting;Sound;Suggestion"


